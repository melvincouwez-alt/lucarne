<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="panel.css">
<style>
body{display:flex;flex-direction:column;background:#000;overflow:hidden}
img{flex:1;min-height:0;width:100%;object-fit:contain;display:block}
.bar{background:var(--bg);display:flex;align-items:center;gap:8px;padding:6px 8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.bar span{flex:1;font-size:12px;font-weight:600}
.bar button{padding:4px 10px;font-size:12px}
</style></head>
<body>
<img id="img" alt="">
<div class="bar"><div class="dot"></div><span id="what" data-i18n>Partage en cours</span><button id="stop" class="decline" data-i18n>Arrêter</button></div>
<script>
const img = document.getElementById("img");
lucarnePanel.onData((d) => {
  if (d.frame) img.src = d.frame;
  if (d.label) document.getElementById("what").textContent = d.label;
});
document.getElementById("stop").onclick = () => lucarnePanel.send({ stop: true });
</script></body></html>
